<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gridscan &middot; assets</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="dot">grid</span>scan</div>
      <nav class="mainnav">
        <a href="dashboard.html" data-nav="dashboard.html">Dashboard</a>
        <a href="findings.html" data-nav="findings.html">Findings</a>
        <a href="review.html" data-nav="review.html">Review</a>
        <a href="assets.html" data-nav="assets.html">Assets</a>
        <a href="scope.html" data-nav="scope.html">Scope</a>
        <a href="settings.html" data-nav="settings.html">Settings</a>
        <a href="users.html" data-nav="users.html">Users</a>
      </nav>
      <div class="topbar-right">
        <span class="user-tag" data-user-tag></span>
        <button data-logout>Logout</button>
      </div>
    </header>

    <main class="content wide">
      <div class="panel">
        <div class="panel-header">
          <h2>Discovered assets</h2>
        </div>

        <form class="filters" id="filters-form">
          <div class="field">
            <label for="filter-tech">Tech</label>
            <input type="search" id="filter-tech" placeholder="e.g. nginx" autocomplete="off" />
          </div>
          <div class="field">
            <label for="filter-status-code">Status code</label>
            <input type="text" id="filter-status-code" placeholder="e.g. 200" autocomplete="off" />
          </div>
          <div class="field">
            <label for="filter-host">Target / host</label>
            <input type="search" id="filter-host" placeholder="e.g. noco or *.example.com" autocomplete="off" />
          </div>
          <div class="field">
            <button type="submit" id="apply-filters">Apply</button>
          </div>
        </form>

        <div class="table-scroll">
          <table class="assets-table">
            <colgroup>
              <col style="width: 22%" /><col style="width: 22%" /><col style="width: 8%" />
              <col style="width: 20%" /><col style="width: 14%" /><col style="width: 14%" />
            </colgroup>
            <thead>
              <tr>
                <th>URL</th>
                <th>Tech</th>
                <th>Status</th>
                <th>Title</th>
                <th>First seen</th>
                <th>Last seen</th>
              </tr>
            </thead>
            <tbody id="assets-body">
              <tr class="empty-row"><td colspan="6">Loading assets...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="assets-msg"></div>
      </div>
    </main>

    <footer class="hint">gridscan-ui &mdash; internal tool</footer>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/assets.js"></script>
</body>
</html>
