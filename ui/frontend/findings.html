<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gridscan &middot; findings</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="dot">grid</span>scan</div>
      <nav class="mainnav">
        <a href="dashboard.html" data-nav="dashboard.html">Dashboard</a>
        <a href="findings.html" data-nav="findings.html">Findings</a>
        <a href="review.html" data-nav="review.html">Review</a>
        <a href="assets.html" data-nav="assets.html">Assets</a>
        <a href="scope.html" data-nav="scope.html">Scope</a>
        <a href="settings.html" data-nav="settings.html">Settings</a>
        <a href="users.html" data-nav="users.html">Users</a>
      </nav>
      <div class="topbar-right">
        <span class="user-tag" data-user-tag></span>
        <button data-logout>Logout</button>
      </div>
    </header>

    <main class="content wide">
      <div class="panel">
        <div class="panel-header">
          <h2>By scan</h2>
        </div>
        <p class="text-dim">What each scan found and what changed since the one before it.</p>
        <div class="actions-row">
          <button id="expand-all-btn">Expand all</button>
          <button id="collapse-all-btn">Collapse all</button>
          <span class="spacer"></span>
          <label for="by-scan-page-size" class="text-dim">Show</label>
          <select id="by-scan-page-size">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
          </select>
          <button id="by-scan-prev-btn">&larr; Prev</button>
          <span id="by-scan-page-label" class="text-dim">Page 1</span>
          <button id="by-scan-next-btn">Next &rarr;</button>
        </div>
        <div id="by-scan-container" class="mt-14">
          <div class="loading">Loading runs...</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Findings</h2>
        </div>

        <form class="filters" id="filters-form">
          <div class="field">
            <label>Severity</label>
            <div class="checkbox-group" id="filter-severity">
              <label class="checkbox-item"><input type="checkbox" value="critical" checked /> Critical</label>
              <label class="checkbox-item"><input type="checkbox" value="high" checked /> High</label>
              <label class="checkbox-item"><input type="checkbox" value="medium" checked /> Medium</label>
              <label class="checkbox-item"><input type="checkbox" value="low" checked /> Low</label>
              <label class="checkbox-item"><input type="checkbox" value="info" checked /> Info</label>
            </div>
          </div>
          <div class="field">
            <label>Status</label>
            <div class="checkbox-group" id="filter-status">
              <label class="checkbox-item"><input type="checkbox" value="open" checked /> Open</label>
              <label class="checkbox-item"><input type="checkbox" value="resolved" checked /> Resolved</label>
            </div>
          </div>
          <div class="field">
            <label for="filter-host">Target / host</label>
            <input type="search" id="filter-host" placeholder="e.g. noco or *.example.com" autocomplete="off" />
          </div>
          <div class="field">
            <label for="filter-run-id">Scan ID</label>
            <input type="number" id="filter-run-id" placeholder="e.g. 14 (see # in By scan)" autocomplete="off" min="1" />
          </div>
          <div class="field">
            <button type="submit" id="apply-filters">Apply</button>
          </div>
        </form>

        <div id="findings-container">
          <div class="loading">Loading findings...</div>
        </div>
      </div>
    </main>

    <footer class="hint">gridscan-ui &mdash; internal tool</footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/findings.js"></script>
</body>
</html>
