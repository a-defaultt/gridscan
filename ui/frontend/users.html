<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gridscan &middot; users</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="dot">grid</span>scan</div>
      <nav class="mainnav">
        <a href="dashboard.html" data-nav="dashboard.html">Dashboard</a>
        <a href="findings.html" data-nav="findings.html">Findings</a>
        <a href="review.html" data-nav="review.html">Review</a>
        <a href="assets.html" data-nav="assets.html">Assets</a>
        <a href="scope.html" data-nav="scope.html">Scope</a>
        <a href="settings.html" data-nav="settings.html">Settings</a>
        <a href="users.html" data-nav="users.html">Users</a>
      </nav>
      <div class="topbar-right">
        <span class="user-tag" data-user-tag></span>
        <button data-logout>Logout</button>
      </div>
    </header>

    <main class="content">
      <div class="panel">
        <div class="panel-header">
          <h2>Add user</h2>
        </div>

        <form id="create-user-form">
          <div class="form-grid">
            <div>
              <label for="new-username">Username</label>
              <input type="text" id="new-username" name="username" autocomplete="off" required />
            </div>
            <div>
              <label for="new-password">Password</label>
              <input type="password" id="new-password" name="password" autocomplete="new-password" required />
            </div>
            <div>
              <label for="new-name">Name</label>
              <input type="text" id="new-name" name="name" autocomplete="off" />
            </div>
            <div>
              <label for="new-email">Email</label>
              <input type="text" id="new-email" name="email" autocomplete="off" />
            </div>
            <div>
              <label for="new-role">Role</label>
              <select id="new-role" name="role">
                <option value="viewer">viewer</option>
                <option value="admin">admin</option>
              </select>
            </div>
          </div>
          <button type="submit" class="primary mt-14" id="create-user-btn">Create user</button>
        </form>

        <div id="create-user-msg"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Users</h2>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Username</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-body">
              <tr class="empty-row"><td colspan="6">Loading users...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="users-msg"></div>
      </div>
    </main>

    <footer class="hint">gridscan-ui &mdash; internal tool</footer>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
