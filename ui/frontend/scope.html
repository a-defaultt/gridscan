<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gridscan &middot; scope</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="dot">grid</span>scan</div>
      <nav class="mainnav">
        <a href="dashboard.html" data-nav="dashboard.html">Dashboard</a>
        <a href="findings.html" data-nav="findings.html">Findings</a>
        <a href="review.html" data-nav="review.html">Review</a>
        <a href="assets.html" data-nav="assets.html">Assets</a>
        <a href="scope.html" data-nav="scope.html">Scope</a>
        <a href="settings.html" data-nav="settings.html">Settings</a>
        <a href="users.html" data-nav="users.html">Users</a>
      </nav>
      <div class="topbar-right">
        <span class="user-tag" data-user-tag></span>
        <button data-logout>Logout</button>
      </div>
    </header>

    <main class="content">
      <div class="panel">
        <div class="panel-header">
          <h2>Scan scope</h2>
        </div>
        <p class="text-dim">
          One target per line. This file controls exactly what gridscan is allowed
          to scan against real infrastructure &mdash; changes take effect on the next run.
        </p>

        <label for="scope-text">scope.txt</label>
        <textarea id="scope-text" spellcheck="false" disabled>Loading scope...</textarea>

        <div class="actions-row mt-14">
          <button class="primary" id="save-btn" disabled data-requires-admin>Save changes</button>
          <span id="scope-status" class="text-dim"></span>
        </div>

        <div id="scope-msg"></div>
      </div>
    </main>

    <footer class="hint">gridscan-ui &mdash; internal tool</footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/scope.js"></script>
</body>
</html>
